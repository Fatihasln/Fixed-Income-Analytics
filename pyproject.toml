[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-engine"
version = "0.8.0"
description = "Corporate bond pricing, duration/DV01/CS01 and credit spread analytics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "python-dateutil>=2.8", "pandas>=2.0", "requests>=2.28", "statsmodels>=0.14", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "QuantLib>=1.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
